# =====================================================================
# sclera-inspection-service — baseline (from sclera-common template)
# Per-environment overrides go in application-{profile}.yml.
# Secrets are NEVER in this file — env vars / vault only.
# =====================================================================

spring:
  application:
    name: sclera-${SCLERA_SERVICE_NAME:inspection-service}
  profiles:
    default: dev

  security:
    oauth2:
      resourceserver:
        jwt:
          # QA: KEYCLOAK_URL=https://qa-app-v2.sclera.com/auth  KEYCLOAK_REALM=sclera
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:sclera}
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:sclera}/protocol/openid-connect/certs

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false
    time-zone: UTC
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

  kafka:
    bootstrap-servers: ${SCLERA_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        # Listener parameter type is JsonNode — payloads deserialize as raw JSON trees
        spring.json.value.default.type: com.fasterxml.jackson.databind.JsonNode

server:
  port: ${SERVER_PORT:8096}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}

sclera:
  async:
    enabled: true
  # Must match procedure-service's secret or Dapr internal calls fail 401 HMAC_FAILED
  event-listener:
    signing-secret: ${SCLERA_INTERNAL_SIGNING_SECRET:dev-internal-signing-secret}
  cors:
    allowed-origins: ${SCLERA_CORS_ALLOWED_ORIGINS:https://app.sclera.com,https://admin.sclera.com}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Content-Type,X-CSRF-Token,X-Requested-With,X-Correlation-ID,Authorization
    allow-credentials: true
    max-age-seconds: 600

logging:
  config: classpath:logback-spring.xml
