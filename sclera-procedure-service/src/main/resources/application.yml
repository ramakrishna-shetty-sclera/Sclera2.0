# =====================================================================
# sclera-procedure-service — baseline (from sclera-common template)
# Per-environment overrides go in application-{profile}.yml.
# Secrets are NEVER in this file — env vars / vault only.
# =====================================================================

spring:
  application:
    name: sclera-${SCLERA_SERVICE_NAME:procedure-service}
  profiles:
    default: dev

  security:
    oauth2:
      resourceserver:
        jwt:
          # QA: KEYCLOAK_URL=https://qa-app-v2.sclera.com/auth  KEYCLOAK_REALM=sclera
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:sclera}
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:sclera}/protocol/openid-connect/certs

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    # Migrations run as the owner, not as the request role. The request role
    # owns nothing on purpose — that is what makes row-level security apply to
    # it — so it cannot create or alter tables.
    #
    # The url has to be repeated here, not just the credentials: giving Flyway a
    # user makes Spring Boot build it a separate DataSource, and that one is
    # assembled from spring.flyway.* alone. Credentials without a url produce
    # "Driver has not been set" at startup.
    url: ${spring.datasource.url}
    user: ${SCLERA_DB_OWNER_USER:sclera}
    password: ${SCLERA_DB_OWNER_PASSWORD:sclera}

  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false
    time-zone: UTC
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

  kafka:
    bootstrap-servers: ${SCLERA_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    # Reads the global-template-events topic (the question bank's indexer). The
    # producer above sends no type headers, so the payload type is named here and
    # not taken from the message. ErrorHandlingDeserializer turns an unreadable
    # message into a logged skip instead of a consumer that loops on it forever.
    consumer:
      group-id: ${spring.application.name}-question-index
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.sclera.applicationplane.procedure.event.GlobalTemplateEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.sclera.applicationplane.procedure.event

server:
  port: ${SERVER_PORT:8095}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}

sclera:
  async:
    enabled: true
  # OpenFGA fine-grained authorization. The store is resolved by NAME at first
  # use (created by setup-openfga.ps1). Set SCLERA_FGA_ENABLED=false to run
  # without OpenFGA (all checks allow; JWT + org scoping still apply).
  fga:
    enabled: ${SCLERA_FGA_ENABLED:true}
    api-url: ${SCLERA_FGA_API_URL:http://localhost:8085}
    store-name: ${SCLERA_FGA_STORE:sclera}
    store-id: ${SCLERA_FGA_STORE_ID:}
    authorization-model-id: ${SCLERA_FGA_MODEL_ID:}
  # Two roles against one database. Requests arrive on spring.datasource's role,
  # which owns nothing and is not a superuser, so Postgres applies row-level
  # security to it. Schema creation, migrations and the tenant registry need
  # privileges that role deliberately lacks, and use the owner below.
  datasource:
    owner:
      username: ${SCLERA_DB_OWNER_USER:sclera}
      password: ${SCLERA_DB_OWNER_PASSWORD:sclera}
    # Granted USAGE and DML on every tenant schema as it is provisioned.
    app-role: ${SCLERA_DB_APP_ROLE:sclera_app}

  # Who holds the property vocabulary a procedure's target types are checked
  # against. Today the helper service, a temporary stand-in: pointing this at a
  # real property service is the whole cutover, with no code change.
  # cache-ttl-seconds: how long one organization's lists are kept before they
  # are read again (0 turns the cache off). A key added in that window may be
  # refused until it expires.
  external:
    vocabulary:
      app-id: ${SCLERA_VOCABULARY_APP_ID:sclera-helper-service}
      cache-ttl-seconds: ${SCLERA_VOCABULARY_CACHE_TTL_SECONDS:90}
    # Where the reference-document storage port lives today (client/storage/).
    storage:
      app-id: ${SCLERA_STORAGE_APP_ID:sclera-helper-service}
  # Shared with every service that calls (or is called on) /internal/** — HMAC signing
  event-listener:
    signing-secret: ${SCLERA_INTERNAL_SIGNING_SECRET:dev-internal-signing-secret}
  cors:
    allowed-origins: ${SCLERA_CORS_ALLOWED_ORIGINS:https://app.sclera.com,https://admin.sclera.com}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Content-Type,X-CSRF-Token,X-Requested-With,X-Correlation-ID,Authorization
    allow-credentials: true
    max-age-seconds: 600

logging:
  config: classpath:logback-spring.xml
