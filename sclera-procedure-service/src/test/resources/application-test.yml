# Test profile. Its real job is to exist: application.yml sets
# `spring.profiles.default: dev`, so without an explicit `test` profile the
# tests would load application-dev.yml and with it spring.data.redis.host.
# sclera-common's RedisCacheConfig is @ConditionalOnProperty on that host and
# fails the context start when Redis is unreachable, so tests would need a Redis
# container for a bean they never touch. PostgresIntegrationTest activates this
# profile; the datasource comes from Testcontainers via @DynamicPropertySource.

spring:
  jpa:
    hibernate:
      # Same as production: Flyway owns the schema, Hibernate only checks that
      # the entities match it. A mapping mistake fails the test context, which
      # is exactly where we want to hear about it.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

sclera:
  fga:
    # FgaAuthorizationService short-circuits to allow when disabled, so tests
    # exercise service rules rather than OpenFGA tuples. Endpoint authorization
    # is a separate concern, covered when the authorization model is extended.
    enabled: false

logging:
  level:
    com.sclera: INFO
    org.testcontainers: WARN
    com.github.dockerjava: WARN
