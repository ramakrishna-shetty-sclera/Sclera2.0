# =====================================================================
# sclera-helper-service — Locations + Assets CRUD, persisted in Postgres
# (sclera_helper DB, schema-per-tenant).
# =====================================================================

spring:
  application:
    name: sclera-${SCLERA_SERVICE_NAME:helper-service}
  profiles:
    default: dev

  datasource:
    url: jdbc:postgresql://${SCLERA_DB_HOST:localhost}:${SCLERA_DB_PORT:5432}/${SCLERA_DB_NAME:sclera_helper}
    username: ${SCLERA_DB_USER:sclera}
    password: ${SCLERA_DB_PASSWORD:sclera}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  # Spring Boot's own defaults are 1 MB for both limits, well under the
  # gateway's 10 MB allowance for this upload path (RequestSizeLimitFilter).
  # Left unset, a file over 1 MB fails multipart parsing before the
  # controller's @RequestParam("file") ever resolves, which Spring sometimes
  # reports as "the required file part is not present" rather than a size
  # error - the actual cause is easy to miss from that message alone.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Public-schema migrations (table copies for validate + tenant_registry).
  # Per-tenant schemas are migrated programmatically (MultiTenancyConfig).
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:sclera}
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:sclera}/protocol/openid-connect/certs

  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false
    time-zone: UTC
    default-property-inclusion: non_null

  data:
    redis:
      host: ${SCLERA_REDIS_HOST:localhost}
      port: ${SCLERA_REDIS_PORT:6379}
      timeout: 3s

server:
  port: ${SERVER_PORT:8097}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        # The probes below include only the application's own state, not Postgres or Redis.
        # Locations and assets do persist in Postgres (sclera_helper).
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}

# sclera-common's MultiRealmJwtDecoderConfig fetches JWKS from `keycloak.url`,
# NOT the spring.security.oauth2.* keys above (which are kept for completeness).
keycloak:
  url: ${KEYCLOAK_URL:http://localhost:8180}
  internal-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}
  browser-url: ${KEYCLOAK_BROWSER_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:sclera}

sclera:
  async:
    enabled: true
  # The storage port (C2): where a reference document's bytes actually live.
  # "local" (the default) writes to a directory on this machine — a Docker
  # named volume in compose, data/documents on a bare java -jar run. "s3" is
  # specified in docs/external-services.md and not implemented; setting the
  # provider to it before that lands fails to start, which is the point —
  # better than silently falling back to local in what looks like production.
  storage:
    provider: ${SCLERA_STORAGE_PROVIDER:local}
    local:
      root-dir: ${SCLERA_STORAGE_LOCAL_ROOT:data/documents}
  # OpenFGA fine-grained authorization. The store is resolved by NAME at first
  # use (created by setup-openfga.ps1). Set SCLERA_FGA_ENABLED=false to run
  # without OpenFGA (all checks allow; JWT + org scoping still apply).
  fga:
    enabled: ${SCLERA_FGA_ENABLED:true}
    api-url: ${SCLERA_FGA_API_URL:http://localhost:8085}
    store-name: ${SCLERA_FGA_STORE:sclera}
    store-id: ${SCLERA_FGA_STORE_ID:}
    authorization-model-id: ${SCLERA_FGA_MODEL_ID:}
  # Shared with every service that calls (or is called on) /internal/** — HMAC signing
  event-listener:
    signing-secret: ${SCLERA_INTERNAL_SIGNING_SECRET:dev-internal-signing-secret}
  cors:
    allowed-origins: ${SCLERA_CORS_ALLOWED_ORIGINS:https://app.sclera.com,https://admin.sclera.com}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Content-Type,X-CSRF-Token,X-Requested-With,X-Correlation-ID,Authorization
    allow-credentials: true
    max-age-seconds: 600
  health:
    dapr:
      enabled: ${SCLERA_DAPR_HEALTH_ENABLED:false}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
  api-docs:
    enabled: true
    path: /v3/api-docs
