# Dapr configuration for the containerized sidecars (`app` compose profile).
# mDNS (the self-hosted default) does not work across Docker containers, so the
# sidecars register in a sqlite database on a shared volume instead.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: appconfig
spec:
  nameResolution:
    component: "sqlite"
    version: "v1"
    configuration:
      connectionString: "/dapr-nr/nameresolution.db"
