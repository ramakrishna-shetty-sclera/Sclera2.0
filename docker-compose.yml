# Local infrastructure for the Sclera application-plane services.
#   docker compose up -d
# Postgres gets one database per service (created by docker/postgres-init).
#
# Fully containerized option (builds and runs the services + Dapr sidecars too):
#   docker compose --profile app up -d --build
# The services keep ports 8095/8096 on the host; get tokens from localhost:8180
# as usual. Don't run this while the host `run-*.ps1` scripts are running —
# they use the same ports.
services:
  postgres:
    image: postgres:16-alpine
    container_name: sclera-postgres
    environment:
      POSTGRES_USER: sclera
      POSTGRES_PASSWORD: sclera
      POSTGRES_DB: sclera
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sclera"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sclera-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: sclera-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: sclera-keycloak
    command: ["start-dev", "--http-port=8180"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"

  # ------------------------------------------------------------------
  # `app` profile: the two services + Dapr sidecars, fully containerized.
  # Each daprd shares its app's network namespace (network_mode: service:...)
  # so app and sidecar talk over localhost, same as `dapr run` on the host.
  # Tokens minted from http://localhost:8180 stay valid: the issuer check uses
  # keycloak.issuer-base-url (default localhost:8180) while JWKS is fetched
  # in-network via KEYCLOAK_URL=http://keycloak:8180.
  # ------------------------------------------------------------------
  procedure-service:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: sclera-procedure-service
    container_name: sclera-procedure-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sclera_procedure
      SCLERA_REDIS_HOST: redis
      SCLERA_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KEYCLOAK_URL: http://keycloak:8180
      SCLERA_DAPR_HEALTH_ENABLED: "true"
    ports:
      - "8095:8095"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started

  procedure-dapr:
    profiles: ["app"]
    image: daprio/daprd:1.18.3
    container_name: sclera-procedure-dapr
    network_mode: "service:procedure-service"
    # daprd's default user (nonroot) cannot create the sqlite name-resolution
    # db on the root-owned shared volume
    user: "0:0"
    command:
      [
        "./daprd",
        "--app-id", "sclera-procedure-service",
        "--app-port", "8095",
        "--dapr-http-port", "3500",
        "--dapr-grpc-port", "50001",
        "--config", "/dapr/config.yaml",
      ]
    volumes:
      - ./docker/dapr:/dapr:ro
      - dapr-nr:/dapr-nr
    depends_on:
      - procedure-service

  inspection-service:
    profiles: ["app"]
    build:
      context: .
      args:
        MODULE: sclera-inspection-service
    container_name: sclera-inspection-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sclera_inspection
      SCLERA_REDIS_HOST: redis
      SCLERA_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KEYCLOAK_URL: http://keycloak:8180
      SCLERA_DAPR_HEALTH_ENABLED: "true"
    ports:
      - "8096:8096"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started

  inspection-dapr:
    profiles: ["app"]
    image: daprio/daprd:1.18.3
    container_name: sclera-inspection-dapr
    network_mode: "service:inspection-service"
    # daprd's default user (nonroot) cannot create the sqlite name-resolution
    # db on the root-owned shared volume
    user: "0:0"
    command:
      [
        "./daprd",
        "--app-id", "sclera-inspection-service",
        "--app-port", "8096",
        "--dapr-http-port", "3500",
        "--dapr-grpc-port", "50001",
        "--config", "/dapr/config.yaml",
      ]
    volumes:
      - ./docker/dapr:/dapr:ro
      - dapr-nr:/dapr-nr
    depends_on:
      - inspection-service

volumes:
  postgres-data:
  dapr-nr:
