<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sclera Procedure Builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  /* Sclera 2.0 tokens (Figma variable names in comments) */
  --page:#0b0b0d;        /* surface/page */
  --surface:#161618;     /* surface/primary */
  --raised:#1e1e21; --line-soft:#26262a;
  --line:#3f4e5c;        /* border/secondary */
  --line-strong:#a6a6ae; /* border/primary */
  --text:#eff2f5;        /* text/body */
  --heading:#ffffff;     /* text/heading */
  --muted:#9ca3af;       /* text/secondary */
  --dim:#5e6975;
  --action:#ffc400;      /* surface/action, border/action, text/action */
  --on-action:#0b0b0d;   /* text/on-action */
  --logo-yellow:#f6cc01; /* surface/logo-yellow */
  --tonal:#51430c; --selected-text:#ffdb77;
  --selected:#312a10;    /* surface/selected */
  --action-tint:rgba(255,196,0,.22); /* state-layer/on-outline/pressed */
  --chip-success:#08361f; --on-success:#c8f5d6; /* surface/chip-success, text/on-success */
  --error:#8f1c16; --on-error:#fff0ef;          /* surface/error (count badge), text/on-error */
  --read-only:#202020;   /* surface/read-only: tooltip, snackbar */
  /* Status Chips: surface/chip-{type}, text/on-{type} (filled) · border/{type}, text/{type} (outline) */
  --chip-warning:#4d2600; --on-warning:#ffe1c7; --warning:#ff9736;
  --chip-error:#470e0b; --error-line:#ff8078;
  --chip-info:#052642; --on-info:#d4e7ff; --info:#5aa9ff; --info-surface:#073863;
  --chip-neutral:#2e2e30;
  --success:#3fd463; --success-line:#22b84c;
  --pass:#7bd88f; --pass-bg:#16301f; --pass-line:#2f6b41;
  --fail:#ff8078; --fail-bg:#3a1714; --fail-line:#7a2e28;
  --r-sm:2px; --r-md:4px; --r-lg:8px; --r-xl:16px; /* border-radius/sm,md,lg · Corner/Large */
  --rail-w:96px; --topbar-h:56px;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--page);color:var(--text);font:400 14px/1.43 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.25px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
input::placeholder,textarea::placeholder{color:var(--muted)}
input[type=checkbox],input[type=radio]{-webkit-appearance:none;appearance:none;flex-shrink:0;width:16px;height:16px;margin:4px;border:2px solid var(--line-strong);border-radius:4px;background:var(--surface);display:inline-grid;place-content:center;cursor:pointer}
input[type=radio]{border-radius:9999px}
input[type=checkbox]:checked{background:var(--action);border-color:var(--action)}
input[type=checkbox]:checked::after{content:"";width:8px;height:4px;border:2px solid var(--on-action);border-top:0;border-right:0;transform:translate(0,-1px) rotate(-45deg)}
input[type=radio]:checked{border-color:var(--action)}
input[type=radio]:checked::after{content:"";width:8px;height:8px;border-radius:9999px;background:var(--action)}
input[type=checkbox]:hover,input[type=radio]:hover{box-shadow:0 0 0 4px var(--raised)}
input[type=checkbox]:disabled,input[type=radio]:disabled{opacity:.38;cursor:not-allowed}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:-1px}
h1,h2,h3{margin:0;color:var(--heading);text-wrap:balance}
p{margin:0}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2a2e;border-radius:9999px;border:2px solid var(--page)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

#root{height:100%}
.app{height:100vh;display:flex}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons */
/* Horizontal Button: size/control/sm 32px, spacing/sm 12px, Medium/Label Medium 12px */
.btn{height:32px;padding:0 12px;border-radius:var(--r-md);border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.25px;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-sm{height:32px;padding:0 12px;font-size:12px;gap:4px}
.btn-xs{height:24px;padding:0 8px;font-size:12px;gap:4px}
.btn-xs svg{width:12px;height:12px}
.btn-primary{background:var(--action);color:var(--on-action)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-primary:disabled,.btn-tonal:disabled,.btn-quiet:disabled{background:var(--raised);color:var(--dim);filter:none}
.btn-outline{border-color:var(--action);color:var(--action)}
.btn-outline:hover{background:rgba(255,196,0,.08)}
.btn-tonal,.btn-quiet{background:var(--tonal);color:var(--selected-text);border-color:transparent}
.btn-tonal:hover,.btn-quiet:hover{background:#453a13}
.btn-ghost{color:var(--action);padding:0 8px}
.btn-ghost:hover{background:rgba(255,196,0,.08)}
/* .btn-quiet is the Secondary (tonal) style */
.btn-danger{background:#b3231c;color:#fff;border-color:transparent}
.btn-danger:hover{filter:brightness(1.1)}
.ibtn{width:32px;height:32px;border-radius:var(--r-md);border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ibtn:hover{background:var(--raised);color:var(--text)}
.ibtn.lg{width:40px;height:40px;color:var(--text)}
.ibtn.xl{width:48px;height:48px;border-radius:var(--r-lg);color:var(--text)}
.ibtn.danger:hover{color:var(--fail)}
.link{border:0;background:none;padding:0;color:var(--action);font-weight:500;font-size:12px}
.link:hover{color:var(--selected-text)}

/* chips */
.pill{height:24px;padding:0 8px;border-radius:9999px;border:1px solid var(--action);background:transparent;color:var(--text);font-size:12px;line-height:16px;font-weight:400;letter-spacing:.25px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill:hover{background:rgba(255,196,0,.08)}
.pill.on{background:var(--tonal);border-color:var(--tonal);color:var(--selected-text)}
.pill.on:hover{background:#453a13}
.pill .n{font-variant-numeric:tabular-nums;color:var(--muted)}
.pill.on .n{color:var(--selected-text)}
/* Status Chips: full radius, spacing/sm x spacing/2xs, Semibold/Body Small */
.tag{height:24px;padding:0 12px;border:1px solid transparent;border-radius:9999px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.4px;display:inline-flex;align-items:center;gap:8px;background:var(--chip-neutral);color:var(--text);white-space:nowrap}
.tag svg{width:14px;height:14px;margin:0 -2px}
.tag.pass{background:var(--chip-success);color:var(--on-success)}
.tag.warn{background:var(--chip-warning);color:var(--on-warning)}
.tag.info{background:var(--chip-info);color:var(--on-info)}
.tag.fail{background:var(--chip-error);color:var(--on-error)}
.tag.line{background:transparent;border-color:var(--line-strong);color:var(--text)}
.tag.line.pass{border-color:var(--success-line);color:var(--success)}
.tag.line.warn{border-color:var(--warning);color:var(--warning)}
.tag.line.info{border-color:var(--info);color:var(--info)}
.tag.line.fail{border-color:var(--error-line);color:var(--error-line)}
/* Badges: count badge, size/badge/count 16px */
.badge{min-width:16px;height:16px;padding:0 4px;border-radius:9999px;background:var(--error);color:var(--on-error);font-size:11px;line-height:16px;font-weight:500;letter-spacing:.4px;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.badge.quiet{background:var(--raised);color:var(--muted)}
.tag.sel{background:var(--chip-info);color:var(--on-info)}
.dot{width:6px;height:6px;border-radius:9999px;display:inline-block;flex-shrink:0}

/* fields: notched label, per Sclera 2.0 text field */
.field{position:relative;padding-top:6px}
.field>label{position:absolute;top:0;left:8px;padding:0 4px;border-radius:var(--r-sm);background:var(--surface);font-size:12px;line-height:12px;font-weight:500;color:var(--muted);z-index:1}
.field:focus-within>label{color:var(--selected-text)}
.field.on-page>label{background:var(--page)}
.req{color:var(--fail)}
.input,.select,.textarea{width:100%;height:40px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:transparent;padding:0 12px;font-size:14px}
.select{display:flex;align-items:center;gap:8px;text-align:left;color:var(--text);background:var(--surface) url("data:image/svg+xml;base64,PHN2ZyBwcmVzZXJ2ZUFzcGVjdFJhdGlvPSJub25lIiBvdmVyZmxvdz0idmlzaWJsZSIgc3R5bGU9ImRpc3BsYXk6IGJsb2NrOyIgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiB2aWV3Qm94PSIwIDAgMjQgMjQiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxnIGlkPSJJY29ucy9PdXRsaW5lL0Fycm93cy9jaGV2cm9uLWRvd24iPgo8cGF0aCBpZD0iVmVjdG9yIiBkPSJNNiA5TDEyIDE1TDE4IDkiIHN0cm9rZT0iI0VGRjJGNSIgc3Ryb2tlLXdpZHRoPSIxLjUiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPgo8L2c+Cjwvc3ZnPgo=") no-repeat right 8px center/24px 24px;padding:0 40px 0 12px;cursor:pointer}
.select.sm{height:32px;font-size:12px}
.dd-v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-v.ph{color:var(--muted)}
.dd{position:relative;width:100%}
.dd.open .select{border-color:var(--action);box-shadow:inset 0 0 0 1px var(--action);background-image:url("data:image/svg+xml;base64,PHN2ZyBwcmVzZXJ2ZUFzcGVjdFJhdGlvPSJub25lIiBvdmVyZmxvdz0idmlzaWJsZSIgc3R5bGU9ImRpc3BsYXk6IGJsb2NrOyIgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiB2aWV3Qm94PSIwIDAgMjQgMjQiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxnIHRyYW5zZm9ybT0icm90YXRlKDE4MCAxMiAxMikiIGlkPSJJY29ucy9PdXRsaW5lL0Fycm93cy9jaGV2cm9uLWRvd24iPgo8cGF0aCBpZD0iVmVjdG9yIiBkPSJNNiA5TDEyIDE1TDE4IDkiIHN0cm9rZT0iI0VGRjJGNSIgc3Ryb2tlLXdpZHRoPSIxLjUiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPgo8L2c+Cjwvc3ZnPgo=")}
.dd.on-page .select{background-color:var(--page)}
.dd-inline{width:auto;display:inline-block}
.dd-inline .select{width:auto;min-width:120px}
.menu{position:absolute;z-index:45;top:calc(100% + 4px);left:0;min-width:100%;max-height:296px;overflow:auto;padding:8px 0;display:flex;flex-direction:column;background:var(--surface);box-shadow:0 4px 4px rgba(0,0,0,.3),0 8px 12px 6px rgba(0,0,0,.15)}
.menu-g{padding:8px 24px 4px;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.menu-row{display:flex;align-items:center;gap:8px;min-height:32px;padding:8px 24px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.25px;color:var(--text);cursor:pointer;white-space:nowrap}
.menu-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.menu.end{left:auto;right:0}
.menu-row[data-hi="1"]{background:#2e2e30} /* surface/header: neutral list-row hover */
.menu-row[aria-selected=true]{background:var(--selected);color:var(--selected-text)}
.menu-row[aria-disabled=true]{opacity:.38;cursor:not-allowed}
.textarea{height:auto;padding:10px 12px;line-height:20px;resize:vertical}
.input.soft{border-color:var(--line)}
.input.sm{height:36px}
.input.invalid,.select.invalid{border-color:var(--fail)}
.input:hover,.select:hover,.textarea:hover{border-color:var(--text)}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--action);box-shadow:inset 0 0 0 1px var(--action)}
.input:disabled,.select:disabled{opacity:.38}

/* switch */
.sw{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0;border:0;background:none;padding:0;font-size:14px;line-height:16px;letter-spacing:.4px}
.sw .track{position:relative;width:40px;height:24px;margin:4px;border-radius:9999px;border:1px solid var(--line-strong);background:var(--surface);flex-shrink:0;transition:background .15s}
.sw .knob{position:absolute;top:50%;left:3px;width:16px;height:16px;border-radius:9999px;background:var(--dim);transform:translateY(-50%);transition:left .15s,width .15s,height .15s}
.sw[aria-checked=true] .track{background:var(--action);border-color:var(--action)}
.sw[aria-checked=true] .knob{left:18px;width:20px;height:20px;background:var(--on-action)}

/* Navigation Rail (Sclera 2.0): 96px, icon-only destinations, 56px state layer */
.rail{position:relative;width:var(--rail-w);flex-shrink:0;padding:32px 0 16px;display:flex;flex-direction:column;align-items:center;gap:32px;background:var(--page)}
.rail{border-right:1px solid var(--line);align-self:stretch;min-height:100%}
.rail-logo{position:relative;width:40px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:var(--r-lg);background:none;padding:0}
.rail-logo:hover{background:var(--raised)}
.rail-logo .open{display:none}
.rail-logo .tip{left:calc(100% + 20px)}
.rail-x .rail-logo .tip{left:auto;right:-8px;top:calc(100% + 8px);transform:none}
.rail-logo:hover .mono,.rail-logo:focus-visible .mono{display:none}
.rail-logo:hover .open,.rail-logo:focus-visible .open{display:block}
.rail-logo .mono{width:32px;height:23.312px;transform:scaleY(-1)}
.rail-sections{flex:1;min-height:0;overflow-y:auto;overflow-x:clip;display:flex;flex-direction:column;gap:12px;width:var(--rail-w)}
.rail-sec{display:flex;flex-direction:column;gap:4px;width:100%}
.rail-sec.first{gap:0}
.rail-div{height:1px;margin:0 16px;background:var(--line)}
.rail-item{position:relative;width:100%;padding:4px 0;border:0;background:none;display:flex;justify-content:center}
.rail-item .ic{width:56px;height:56px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center}
.rail-item .ic img,.rail-item .ic svg{width:24px;height:24px}
.rail-item:hover .ic{background:var(--raised)}
.rail-item[aria-current=page] .ic{background:var(--selected)}
.tip{position:absolute;left:calc(100% - 8px);top:50%;transform:translateY(-50%);z-index:60;white-space:nowrap;padding:12px;border-radius:var(--r-lg);background:var(--read-only);color:var(--muted);font-size:12px;line-height:16px;letter-spacing:.25px;box-shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);pointer-events:none;opacity:0;transition:opacity .12s}
.rail-item:hover .tip,.rail-item:focus-visible .tip,.rail-logo:hover .tip,.rail-logo:focus-visible .tip{opacity:1}
.avatar{width:48px;height:48px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar span{width:32px;height:32px;border-radius:9999px;border:1px solid var(--line-strong);background:var(--tonal);color:var(--selected-text);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
/* Navigation Rail: Expanded (220px) */
.rail-x{width:220px;padding:32px 16px 16px;align-items:stretch}
.rail-head{display:flex;align-items:center;gap:4px;min-height:40px}
.rail-word{flex:1;min-width:0;padding:4px;display:flex}
.rail-x .rail-sections{width:auto;gap:12px}
.rail-x .rail-sec{gap:0}
.rail-sh{padding:4px 16px;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-row{display:flex;align-items:center;gap:8px;width:100%;padding:8px 16px;border:0;border-radius:var(--r-lg);background:none;color:var(--text);font-size:14px;line-height:16px;font-weight:500;letter-spacing:.5px;text-align:left;white-space:nowrap}
.rail-row img{flex-shrink:0}
.rail-row:hover{background:var(--raised)}
.rail-row[aria-current=page]{background:var(--selected)}
.acct{display:flex;align-items:center;gap:2px;height:40px;border:0;background:none;padding:0;text-align:left;color:var(--text)}
.acct .av{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acct .av span{width:28px;height:28px;border-radius:9999px;border:1px solid var(--line-strong);background:var(--tonal);color:var(--selected-text);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center}
.acct-t{display:flex;flex-direction:column;min-width:0;font-size:11px;line-height:16px;letter-spacing:.4px}
.acct-t b{font-weight:500}
.acct-t i{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Top Bar (Sclera 2.0): 56px, breadcrumbs left, org menu + search + icon buttons right */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--topbar-h);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0}
.crumb{display:inline-flex;align-items:center;gap:8px;height:24px}
.crumb a,.crumb span.cur{padding:2px;border-radius:var(--r-sm);font-size:14px;line-height:16px;letter-spacing:.5px;white-space:nowrap}
.crumb a{color:var(--muted);text-decoration:none;cursor:pointer;border:0;background:none}
.crumb a:hover{color:var(--text)}
.crumb span.cur{color:var(--text);max-width:360px;overflow:hidden;text-overflow:ellipsis}
.crumb img{width:16px;height:16px}
.tb-right{display:flex;align-items:center;gap:16px;justify-content:flex-end}
.orgmenu{width:228px;height:32px;padding:8px 8px 8px 24px;border:0;background:var(--surface);display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;font-weight:500;color:var(--text);text-align:left}
.orgmenu span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orgmenu img{width:24px;height:24px}
.tb-icons{display:flex;align-items:center}
.tb-icons button{width:32px;height:32px;border:0;border-radius:var(--r-lg);background:none;display:flex;align-items:center;justify-content:center}
.tb-icons button:hover{background:var(--raised)}
.tb-icons img{width:16px;height:16px}
.scroll{flex:1;overflow:auto}

/* Page header (Sclera 2.0): 48px back icon button, Headline 6 title, Body XSmall subtitle */
.phead{flex-shrink:0;display:flex;align-items:flex-start;gap:12px;padding:16px 24px 16px 12px;border-bottom:1px solid var(--line)}
.phead .ptitle{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center;min-height:48px}
.phead h1{font-size:20px;line-height:28px;font-weight:400;letter-spacing:0;color:var(--heading)}
.phead .psub{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--muted)}
.phead .pacts{display:flex;align-items:center;gap:8px;align-self:center}
.phead.nobk{padding-left:24px}

/* Tabs (Sclera 2.0 primary tabs): 48px, Medium/Label Medium, 3px indicator */
.dtabs{display:flex;height:48px;border-bottom:1px solid var(--line)}
.dtab{position:relative;height:48px;padding:8px 12px;border:0;background:none;color:var(--text);font-size:12px;line-height:16px;font-weight:500;letter-spacing:.25px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.dtab:hover{background:var(--raised)}
.dtab[aria-selected=true]::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:100px 100px 0 0;background:var(--action)}
.dtabs.fill .dtab{flex:1}

/* Metric card */
.metric{flex:1;min-width:0;padding:16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);display:flex;gap:8px;align-items:flex-start}
.metric .mbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.metric .mlabel{font-size:12px;line-height:16px;letter-spacing:.25px;color:var(--muted);text-transform:uppercase}
.metric .mval{font-size:24px;line-height:28px;font-weight:400;color:var(--heading);font-variant-numeric:tabular-nums}
.metric .mnote{font-size:12px;line-height:16px;letter-spacing:.25px;color:var(--muted)}
.ichip{padding:8px;border-radius:var(--r-lg);background:var(--action-tint);color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* Card with header, and label/value fields */
.dcard{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}

/* library */
.lib-head{padding:16px 24px 0;display:flex;flex-direction:column;gap:16px}
/* Search bar (Sclera 2.0): 32px, surface/primary, 16px icon, Label Medium */
.search{height:32px;width:280px;border-radius:var(--r-md);background:var(--surface);display:flex;align-items:center;padding:4px 8px}

.search.wide{width:360px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}

.meta3 span span:first-child{color:var(--muted);display:block}
.muted{color:var(--muted)}
.small{font-size:12px}

/* builder shell */
.bshell{flex:1;display:flex;flex-direction:column;min-width:0}
.bhead{flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:16px 24px 16px 12px}

.title-input:focus{border-color:var(--line-strong);outline:none}
.saved{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.ready{height:32px;padding:0 12px;border-radius:9999px;border:0;background:var(--fail-bg);color:var(--fail);font-size:12px;letter-spacing:.4px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.ready.ok{background:var(--chip-success);color:var(--on-success)}
.bbody{flex:1;display:flex;min-height:0}

/* navigator */
.navi{width:288px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--page)}

.jump .input{height:36px}
.navi-list{flex:1;overflow:auto;padding:8px 8px 16px;outline:none}
.nitem{position:relative;display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:var(--r-md);border:1px solid transparent;width:100%;background:transparent;text-align:left}

.nitem .txt{font-size:13px;line-height:18px}
.nitem .sub{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
.warn{color:var(--fail)}
.navi-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:var(--r-sm);border:1px solid var(--line);font-size:11px;color:var(--muted)}
.section-nav{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}

.canvas{flex:1;min-width:0;overflow:auto;scroll-behavior:smooth}

.opts-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ochip{height:24px;padding:0 12px;border-radius:9999px;border:1px solid var(--line-strong);font-size:12px;line-height:16px;font-weight:600;letter-spacing:.4px;display:inline-flex;align-items:center;gap:6px}

.qrow{display:flex;gap:12px;align-items:flex-start}
.indent{margin-left:46px}
.hint{font-size:11px;line-height:16px;letter-spacing:.4px;color:var(--muted)}
.optrow{display:flex;align-items:center;gap:10px}
.glyph{width:16px;height:16px;border:1.5px solid var(--line-strong);border-radius:9999px;flex-shrink:0}

.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-md);overflow:hidden}
.seg button{height:32px;min-width:72px;padding:0 12px;border:0;border-right:1px solid var(--line-strong);background:transparent;color:var(--text);font-size:12px;font-weight:500;letter-spacing:.25px;display:inline-flex;align-items:center;justify-content:center;gap:4px}

.fu-btn{height:32px;padding:0 12px;border-radius:var(--r-md);border:1px solid var(--action);background:transparent;color:var(--action);font-size:12px;font-weight:500;letter-spacing:.25px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}

.fu-btn.has{border-color:transparent;background:var(--tonal);color:var(--selected-text)}
.divider{height:1px;background:var(--line)}
.qfoot{display:flex;align-items:center;gap:16px;flex-wrap:nowrap;min-height:40px}
.alert-prof{display:flex;flex-direction:column;gap:4px;max-width:420px}
.alert-prof .hint{padding:0 8px}
.hint.warn{color:var(--error-line)}
.children{margin-left:26px;padding-left:18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px;padding-top:10px}
.when{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}
.inserter{height:14px;position:relative;display:flex;align-items:center;justify-content:center}
.inserter button{opacity:0;height:24px;padding:0 8px;border-radius:var(--r-md);border:1px solid var(--action);background:var(--page);color:var(--action);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:4px;transition:opacity .12s}
.inserter:hover button,.inserter button:focus-visible{opacity:1}
.inserter::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:transparent}
.inserter:hover::before{background:var(--tonal)}
.inserter button{position:relative}
.quick{border:1px dashed var(--line);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.section-card{border:0;border-bottom:1px solid var(--line);padding:18px 0 8px;display:flex;align-items:center;gap:10px}
.section-card input{flex:1;border:0;background:transparent;font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:4px 0}
.section-card input:focus{outline:none;color:var(--text)}

/* type picker */
.popover{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-md);box-shadow:0 16px 40px rgba(0,0,0,.55);padding:8px}

/* side panel */
.side{width:360px;flex-shrink:0;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.stabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line);flex-shrink:0;height:48px}
.stab{position:relative;height:48px;padding:8px 4px;border:0;background:transparent;color:var(--text);font-size:12px;line-height:16px;font-weight:500;letter-spacing:.25px;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.stab svg{width:14px;height:14px;color:var(--muted)}
.stab:hover{background:var(--raised)}
.stab[aria-selected=true]::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:100px 100px 0 0;background:var(--action)}
.stab[aria-selected=true] svg{color:var(--action)}
.side.pulse{animation:pulse .9s ease-out}
@keyframes pulse{0%{box-shadow:inset 0 0 0 3px var(--action)}100%{box-shadow:inset 0 0 0 0 transparent}}
.srcstrip{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.srcbtn{flex:1;display:flex;align-items:center;gap:10px;height:52px;padding:0 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--page);text-align:left}
.srcbtn:hover{border-color:var(--action)}
.srcbtn.on{border-color:var(--action);background:var(--selected)}
.seg-tabs{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-md);overflow:hidden}
.seg-tabs button{height:32px;padding:0 12px;border:0;border-right:1px solid var(--line-strong);background:transparent;color:var(--text);font-size:12px;font-weight:500;letter-spacing:.25px;display:inline-flex;align-items:center;gap:6px}
.seg-tabs button:last-child{border-right:0}
.seg-tabs button:hover{background:var(--raised)}
.seg-tabs button[aria-pressed=true],.seg-tabs button[aria-selected=true]{background:var(--tonal);color:var(--selected-text)}
.fcard{height:150px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.fcard:hover{border-color:var(--line-strong)}
.pcard.draft{border-style:dashed}
.tabs{display:flex;padding:0 8px;border-bottom:1px solid var(--line)}
.tab{flex:1;justify-content:center;height:48px;padding:0 4px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected=true]{border-bottom-color:var(--action);color:var(--text)}
.side-body{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.check{display:flex;align-items:center;gap:10px;font-size:13px}

.radio i{width:8px;height:8px;border-radius:9999px}
.choice[aria-checked=true] .radio i{background:var(--action)}
.tcard{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px}
.topic{display:flex;gap:10px;padding:10px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--page);cursor:pointer}

/* overlays */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:24px}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;max-height:100%;overflow:hidden;box-shadow:0 8px 12px 6px rgba(0,0,0,.15),0 4px 4px rgba(0,0,0,.3)}
.dhead{padding:24px 24px 16px;display:flex;align-items:center;gap:12px}

.dbody{flex:1;overflow:auto;padding:0 24px 16px;font-size:14px;line-height:20px}
.dfoot{padding:12px 24px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:70;display:flex;align-items:stretch;min-width:420px;max-width:812px;box-shadow:0 8px 12px 6px rgba(0,0,0,.15),0 4px 4px rgba(0,0,0,.3)}

.toast .t-body span{flex:1}
.toast .t-body .btn{height:32px}
.spin{width:22px;height:22px;border-radius:9999px;border:3px solid var(--selected);border-top-color:var(--action);animation:spin .9s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.phone{width:390px;height:680px;border:1px solid var(--line);border-radius:28px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.simopt{min-width:72px;height:40px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--action);background:transparent;color:var(--action);font-weight:500;font-size:14px}

.simopt.fail[aria-pressed=true]{background:var(--chip-error);border-color:var(--error-line);color:var(--on-error)}
.optlist{display:flex;flex-direction:column;gap:6px}
.optline{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:var(--r-md);border:1px solid var(--line);cursor:pointer}

.thumb{width:96px;height:80px;border-radius:var(--r-md);background:var(--raised);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;color:var(--muted)}

.empty{border:1px dashed var(--line);border-radius:var(--r-lg);padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.start{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:720px}

.start button:hover{border-color:var(--action)}

        <div className="seg" role="group" aria-label=${'Result when answer is ' + (o.label || 'this')}>

          <button className="fail" aria-pressed=${String(o.result === 'fail')} onClick=${() => setOpt(o.id, { result: o.result === 'fail' ? null : 'fail' })}><${I} n="x" s=${12} w=${3} />Fail</button>

        ${!fixed && q.options.length > 2 ? html`<button className="ibtn danger" aria-label=${'Remove answer ' + (o.label || idx + 1)} onClick=${() => ctx.removeOption(q.id, o.id)}><${I} n="trash" /></button>` : html`<span style=${{ width: 32 }}></span>`}
      </div>`; })}

    ${issues.length > 0 && ctx.showErrors && html`<div className="indent tag fail" style=${{ height: 'auto', padding: '6px 10px', alignSelf: 'flex-start' }}><${I} n="warn" s=${12} />${issues.join(' · ')}</div>`}
    <div className="divider indent"></div>
    <div className="indent qfoot">
      <${Switch} on=${q.required} label="Required" onChange=${(v) => set({ required: v })} />
      ${choice && html`<${Switch} on=${q.wo} label="Work order on Fail" onChange=${(v) => set({ wo: v })} />`}
      <div className="row" style=${{ marginLeft: 'auto', gap: 2 }}>
        <button className="ibtn" aria-label="Move up" title="Move up (Alt+↑)" onClick=${() => ctx.move(q.id, -1)}><${I} n="up" /></button>
        <button className="ibtn" aria-label="Move down" title="Move down (Alt+↓)" onClick=${() => ctx.move(q.id, 1)}><${I} n="down" /></button>
        <button className="ibtn" aria-label="Duplicate question" title="Duplicate" onClick=${() => ctx.duplicate(q.id)}><${I} n="copy" /></button>
        <button className="ibtn danger" aria-label="Delete question" title="Delete" onClick=${() => ctx.remove(q.id)}><${I} n="trash" /></button>
        <button className="btn btn-quiet btn-sm" style=${{ marginLeft: 8 }} onClick=${() => ctx.select(null)}>Done</button>

    ${choice && q.wo && html`<div className="indent"><${AlertProfile} q=${q} set=${set} showError=${ctx.showErrors} /></div>`}
  </div>`;
}

/* ---------------- navigator ---------------- */
function Navigator({ flat, active, issues, onSelect, onMove, onReorder, onAdd }) {
  const [filter, setFilter] = useState('all');
  const [query, setQuery] = useState('');
  const [jump, setJump] = useState('');
  const [jumpErr, setJumpErr] = useState('');
  const [drag, setDrag] = useState(null);
  const [over, setOver] = useState(null);
  const listRef = useRef(null);
  const questions = flat.filter((f) => !f.isSection);
  const attention = questions.filter((f) => (issues[f.q.id] || []).length);
  const withFollow = questions.filter((f) => f.q.follow.length);
  const needle = query.trim().toLowerCase();
  const shown = flat.filter((f) => {
    if (f.isSection) return filter === 'all' && !needle;
    if (filter === 'attention' && !(issues[f.q.id] || []).length) return false;
    if (filter === 'required' && !f.q.required) return false;
    if (filter === 'follow' && !f.q.follow.length && !f.parent) return false;
    if (needle && (f.q.text + ' ' + f.num).toLowerCase().indexOf(needle) < 0) return false;
    return true;
  });
  const doJump = (e) => {
    e.preventDefault();
    const v = jump.trim(); if (!v) return;
    const hit = questions.find((f) => f.num === v);
    if (hit) { onSelect(hit.q.id, true); setJump(''); setJumpErr(''); } else setJumpErr('No question ' + v);
  };
  useEffect(() => {
    if (!active || !listRef.current) return;
    const el = listRef.current.querySelector('[data-id="' + active + '"]');
    if (el) { const L = listRef.current; const r = el.getBoundingClientRect(); const lr = L.getBoundingClientRect(); if (r.top < lr.top) L.scrollTop += r.top - lr.top - 8; else if (r.bottom > lr.bottom) L.scrollTop += r.bottom - lr.bottom + 8; }
  }, [active]);
  const onKey = (e) => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const items = shown.filter((f) => !f.isSection);
    const i = items.findIndex((f) => f.q.id === active);
    e.preventDefault();
    if (e.altKey && active) { onMove(active, e.key === 'ArrowUp' ? -1 : 1); return; }
    const n = e.key === 'ArrowDown' ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1);
    if (items[n]) onSelect(items[n].q.id, true, true);
  };
  const filters = [['all', 'All', questions.length], ['attention', 'Needs attention', attention.length], ['required', 'Required', questions.filter((f) => f.q.required).length], ['follow', 'Follow-ups', withFollow.length]];
  return html`<nav className="navi" aria-label="Question navigator">
    <div className="navi-top">
      <div className="row between"><h2 style=${{ fontSize: 15, fontWeight: 600 }}>Questions</h2><span className="small muted" style=${{ fontVariantNumeric: 'tabular-nums' }}>${countLabel(questions)}</span></div>
      <form className="jump" onSubmit=${doJump}>
        <label htmlFor="jump" className="sr">Go to question number</label>
        <input id="jump" className=${'input sm' + (jumpErr ? ' invalid' : '')} style=${{ width: 96 }} inputMode="decimal" placeholder="Go to #" value=${jump} onChange=${(e) => { setJump(e.target.value); setJumpErr(''); }} />
        <label htmlFor="nsearch" className="sr">Search questions</label>
        <input id="nsearch" type="search" className="input sm soft" style=${{ flex: 1 }} placeholder="Search" value=${query} onChange=${(e) => setQuery(e.target.value)} />
      </form>
      ${jumpErr && html`<span className="small warn">${jumpErr}. Numbers look like 4 or 4.1.</span>`}
      <div className="row" style=${{ gap: 6, flexWrap: 'wrap' }} role="group" aria-label="Show">
        ${filters.map(([k, l, n]) => html`<button key=${k} className=${'pill' + (filter === k ? ' on' : '')} aria-pressed=${String(filter === k)} onClick=${() => setFilter(k)}>${k === 'attention' && n > 0 && html`<span className="dot" style=${{ background: 'var(--fail)' }}></span>`}${l}<span className="n">${n}</span></button>`)}
      </div>
    </div>
    <div className="navi-list" ref=${listRef} tabIndex="0" onKeyDown=${onKey} aria-label="Questions. Use arrow keys to move between questions, Alt plus arrow to reorder.">
      ${shown.length === 0 && html`<p className="small muted" style=${{ padding: 12 }}>${filter === 'attention' ? 'Nothing needs attention.' : 'No questions match.'}</p>`}
      ${shown.map((f) => {
        if (f.isSection) return html`<div key=${f.q.id} className="section-nav">${f.q.text || 'Untitled section'}</div>`;
        const iss = issues[f.q.id] || [];
        const draggable = true;
        return html`<button key=${f.q.id} data-id=${f.q.id} type="button" draggable=${draggable}
          className=${'nitem' + (active === f.q.id ? ' cur' : '') + (over === f.q.id && drag && drag !== f.q.id ? ' drop-before' : '')}
          style=${{ paddingLeft: 8 + f.depth * 16 }}
          onClick=${() => onSelect(f.q.id, true)}
          onDragStart=${(e) => { setDrag(f.q.id); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', f.q.id); }}
          onDragOver=${(e) => { if (drag) { e.preventDefault(); setOver(f.q.id); } }}
          onDragLeave=${() => setOver(null)}
          onDrop=${(e) => { e.preventDefault(); if (drag && drag !== f.q.id) onReorder(drag, f.q.id); setDrag(null); setOver(null); }}
          onDragEnd=${() => { setDrag(null); setOver(null); }}>
          <span className="grip" aria-hidden="true"><${I} n="grip" s=${14} w=${3} /></span>
          <span className="num">${f.num}</span>
          <span className="body">
            <span className=${'txt ellipsis' + (f.q.text ? '' : ' muted')}>${f.q.text || 'Untitled question'}</span>
            <span className="sub">
              ${f.parent && html`<span className="tag sel" style=${{ height: 18, fontSize: 10 }}>If ${f.whenLabel}</span>`}
              <${I} n=${TYPE_ICON[f.q.type]} s=${11} />${f.q.type}
              ${f.q.required && html`<span className="req">Required</span>`}
              ${f.q.follow.length > 0 && html`<span>· ${f.q.follow.length} follow-up${f.q.follow.length > 1 ? 's' : ''}</span>`}
            </span>
          </span>
          ${iss.length > 0 && html`<span className="warn" title=${iss.join(', ')} aria-label=${'Needs attention: ' + iss.join(', ')}><${I} n="warn" s=${14} /></span>`}
        </button>`;
      })}
    </div>
    <div className="navi-foot">
      <span><span className="kbd">↑</span> <span className="kbd">↓</span> move · <span className="kbd">Alt</span>+<span className="kbd">↑</span> reorder</span>
      <button className="btn btn-outline btn-xs" onClick=${onAdd}><${I} n="plus" s=${12} w=${2.6} />Question</button>
    </div>
  </nav>`;
}

function ReviewDialog({ review, existing, onClose, onConfirm }) {
  const dup = review.items.map((q) => existing.indexOf(norm(q.text)) >= 0);

  const n = sel.filter(Boolean).length;

    update: (id, fn) => setQs((l) => updateQ(l, id, fn)),
    changeType: (id, t) => setQs((l) => updateQ(l, id, (x) => {
      if (!isChoice(t) && x.follow.length) return x;
      const next = Object.assign({}, x, { type: t, options: mkOpts(t) });
      if (isChoice(x.type) && isChoice(t)) {
        next.options = next.options.map((o) => { const old = x.options.find((p) => p.label === o.label); return old ? Object.assign({}, o, { id: old.id, result: old.result }) : o; });
        next.follow = x.follow.map((c) => (next.options.some((o) => o.id === c.when) ? c : Object.assign({}, c, { when: (next.options.find((o) => o.result === 'fail') || next.options[0]).id })));
      }
      if (!isChoice(t)) next.wo = false;
      return next;
    })),
    addOption: (id) => setQs((l) => updateQ(l, id, (x) => Object.assign({}, x, { options: x.options.concat([opt('')]) }))),
    removeOption: (id, oid) => setQs((l) => updateQ(l, id, (x) => {
      const kids = x.follow.filter((c) => c.when === oid).length;
      if (kids) flash({ msg: 'Answer removed. Its ' + kids + ' follow-up' + (kids > 1 ? 's are' : ' is') + ' kept: choose a new answer for ' + (kids > 1 ? 'them' : 'it') + '.' });
      return Object.assign({}, x, { options: x.options.filter((o) => o.id !== oid), follow: x.follow.map((c) => (c.when === oid ? Object.assign({}, c, { when: null }) : c)) });
    })),
    addFollow: (id, oid) => { const c = mkQ('', 'Text', { when: oid }); setQs((l) => updateQ(l, id, (x) => Object.assign({}, x, { follow: x.follow.concat([c]) }))); setTimeout(() => select(c.id, true), 0); },
    addAfter: (id) => {
      const loc = findLoc(d.questions, id); if (!loc) return;

      setQs((l) => insertAt(l, loc.parent && loc.parent.id, loc.index + 1, q));
      setTimeout(() => select(q.id, true), 0);
    },
    insertAt: (index) => { const q = mkQ('', 'Yes/No'); setQs((l) => insertAt(l, null, index, q)); setTimeout(() => select(q.id, true), 0); },
    move: (id, dir) => setQs((l) => { const loc = findLoc(l, id); return loc ? moveQ(l, id, loc.index + dir) : l; }),
    duplicate: (id) => { const loc = findLoc(d.questions, id); if (!loc) return; const c = cloneQ(loc.q); setQs((l) => insertAt(l, loc.parent && loc.parent.id, loc.index + 1, c)); setTimeout(() => select(c.id, true), 0); flash({ msg: 'Question duplicated' }); },
    remove: (id) => {
      const [next, info] = removeQ(d.questions, id); if (!info) return;
      setD({ questions: next }); setActive(null);
      const kids = flatten([info.q]).length - 1;

    },
    reviewTemplate: (t) => setReview({ kind: 'tpl', title: t.name, tags: [t.cat, t.std], items: t.specs.map((s) => build(s, 'Template', t.std)), meta: t }),

      setTimeout(tick, 550);

    openDocLib: () => setDocLib(true),

  const openSource = (t) => { setTab(t); setSourcePulse(t); setTimeout(() => setSourcePulse(null), 900); };
  const confirmReview = (items) => {

        </div>
        <button className="btn btn-quiet" onClick=${() => onSaveDraft(d)}>Save draft</button>
        <button className="btn btn-outline" disabled=${!qCount} style=${qCount ? null : { borderColor: 'var(--line)', color: 'var(--dim)' }} onClick=${() => setPreview(true)}><${I} n="eye" />Preview</button>

    </header>
    <div className="bbody">
      <${Navigator} flat=${flat} active=${active} issues=${issues} onSelect=${select}
        onMove=${ctx.move} onAdd=${() => addTop('Yes/No')}
        onReorder=${(dragId, targetId) => {
          const a = findLoc(d.questions, dragId); const b = findLoc(d.questions, targetId);
          if (!a || !b) return;
          const sameParent = (a.parent && a.parent.id) === (b.parent && b.parent.id);
          if (!sameParent) { flash({ msg: 'Drag within the same level. Follow-ups stay with their question.' }); return; }
          setQs((l) => moveQ(l, dragId, b.index > a.index ? b.index - 1 : b.index));
        }} />
      <main className="canvas" onKeyDown=${onCanvasKey} aria-label="Checklist">
        <div className="canvas-in">
          ${qCount > 0 && html`<div className="stepper">
            <span style=${{ fontWeight: 600, color: '#fff', fontSize: 16 }}>Checklist</span>
            <span className="small muted" style=${{ fontVariantNumeric: 'tabular-nums' }}>${activeInfo ? (activeInfo.parent ? 'Follow-up ' + activeInfo.num + ' (under question ' + activeInfo.num.split('.')[0] + ')' : 'Question ' + activeInfo.num + ' of ' + qList.filter((f) => !f.parent).length) : countLabel(qList)}</span>
            <div className="row" style=${{ gap: 4 }}>
              <button className="ibtn" aria-label="Previous question" disabled=${ai <= 0} onClick=${() => select(qList[Math.max(0, ai - 1)].q.id, true)}><${I} n="chevU" /></button>
              <button className="ibtn" aria-label="Next question" disabled=${ai >= qList.length - 1} onClick=${() => select(qList[Math.min(qList.length - 1, ai + 1)].q.id, true)}><${I} n="chevD" /></button>
            </div>
            <div className="row" style=${{ marginLeft: 'auto', gap: 8 }}>
              <button className="btn btn-quiet btn-sm" onClick=${() => { const s = section('New section'); setQs((l) => l.concat([s])); }}><${I} n="section" s=${14} />Section</button>              <button className="btn btn-primary btn-sm" onClick=${() => addTop('Yes/No')}><${I} n="plus" s=${14} w=${2.6} />Question</button>

          ${qCount === 0 && html`<div className="empty">

            <div className="start">

              <button onClick=${() => openSource('docs')}><${I} n="doc" s=${22} c="#ffc400" /><span style=${{ fontWeight: 600 }}>Use a document</span><span className="small muted">Generate questions from an NFPA standard or your SOP.</span></button>
              <button onClick=${() => { const el = document.getElementById('quick-input'); if (el) el.focus(); }}><${I} n="pen" s=${22} c="#ffc400" /><span style=${{ fontWeight: 600 }}>Type questions</span><span className="small muted">Add one by one, or paste a whole list.</span></button>

            ${i > 0 && html`<div className="inserter"><button onClick=${() => ctx.insertAt(i)} aria-label=${'Insert question here'}><${I} n="plus" s=${11} w=${3} />Insert question</button></div>`}

          <//>`)}

          <form className="quick" onSubmit=${quickAdd} aria-label="Quick add">
            <div className="row between"><span style=${{ fontWeight: 600 }}>${bulk ? 'Paste several questions' : 'Quick add'}</span><button type="button" className="link" onClick=${() => setBulk(!bulk)}>${bulk ? 'Add one at a time' : 'Paste a list instead'}</button></div>
            <div className="row" style=${{ alignItems: 'flex-start' }}>
              ${bulk ? html`<textarea id="quick-input" className="textarea" rows="5" style=${{ flex: 1 }} value=${quick} onChange=${(e) => setQuick(e.target.value)} placeholder=${'One question per line, for example:\nIs the exit sign lit?\nIs the fire door closed?\nRecord the room temperature'}></textarea>`
                : html`<input id="quick-input" className="input" style=${{ flex: 1 }} value=${quick} onChange=${(e) => setQuick(e.target.value)} placeholder="Type a question and press Enter" />`}
              <label htmlFor="quick-type" className="sr">Answer type</label>
              <${Dropdown} id="quick-type" ariaLabel="Answer type" style=${{ width: 190 }} menuWidth=${240} value=${quickType} onChange=${setQuickType} options=${[].concat.apply([], TYPE_GROUPS.map((g) => g.items.map(([t, ic]) => ({ value: t, label: t, icon: ic, group: g.g }))))} />
              <button className="btn btn-primary" type="submit" disabled=${!quick.trim()}>${bulk ? 'Add all' : 'Add'}</button>
            </div>
            <span className="hint">${bulk ? 'Numbers and bullets at the start of lines are removed.' : 'Each question gets the answer type on the right. Change it on the card later.'}</span>
          </form>
        </div>
      </main>
      <${SidePanel} tab=${tab} setTab=${setTab} d=${d} setD=${setD} checks=${checks} ctx=${ctx} pulse=${sourcePulse} />
    </div>
    ${review && html`<${ReviewDialog} review=${review} existing=${flat.map((f) => norm(f.q.text || ''))} onClose=${() => setReview(null)} onConfirm=${confirmReview} />`}
    ${genStep >= 0 && html`<${Generating} step=${genStep} />`}
    ${docLib && html`<${DocLibrary} mode="builder" docs=${libDocs} onImport=${onImport} onClose=${() => setDocLib(false)} onConfirm=${(docs) => { const have = d.docs.map((x) => x.key); setD({ docs: d.docs.concat(docs.filter((x) => have.indexOf(x.key) < 0)).slice(0, 5) }); setDocLib(false); setTab('docs'); }} />`}
    ${preview && html`<${Preview} d=${d} onClose=${() => setPreview(false)} />`}
    ${confirmClose && html`<${Confirm} title="Save before closing?" body=${isEdit ? 'Save your changes as a draft to finish later. The published version stays live until you publish again.' : 'Save this procedure as a draft to finish later. Drafts appear in Procedures under Drafts.'} yes="Discard" no="Keep editing" save="Save as draft" onSave=${() => onSaveDraft(d)} onYes=${onExit} onNo=${() => setConfirmClose(false)} />`}
    ${publishing && html`<div className="scrim"><div className="dialog" role="status" style=${{ width: 360, padding: 32, alignItems: 'center', gap: 16 }}><span className="spin" style=${{ width: 56, height: 56, borderWidth: 6 }}></span><span style=${{ fontWeight: 500 }}>${isEdit ? 'Updating procedure' : 'Publishing procedure'}</span></div></div>`}
  </div>`;
}

function toFix(p) {
  let n = 0; if (!p.name || !p.name.trim()) n++; if (!p.cat || !p.sub) n++;
  const fl = flatten(p.questions || []); const qs = fl.filter((f) => !f.isSection);
  if (!qs.length) n++; if (fl.some((f) => qIssues(f.q, f.parent).length)) n++;
  return n;
}

    <div className="lib-head">
      <div className="dtabs" role="tablist" aria-label="Status">
        ${[['all', 'All', base.length], ['published', 'Published', pub], ['draft', 'Drafts', drafts]].map(([k, l, c]) => html`<button key=${k} role="tab" className="dtab" aria-selected=${String(status === k)} onClick=${() => setStatus(k)}>${l}<span className=${'badge' + (k === 'draft' && c ? '' : ' quiet')}>${c}</span></button>`)}
      </div>
      <div className="row between" style=${{ paddingBottom: 16, flexWrap: 'wrap', gap: 12 }}>
        <div className="row" style=${{ gap: 12, flexWrap: 'wrap' }}>
          <label className="search"><span className="sic"><img src=${ASSET.search} alt="" /></span><input type="search" aria-label="Search procedures" placeholder="Search by name or standard" value=${q} onChange=${(e) => setQ(e.target.value)} /></label>
          ${[['cat', 'Category'], ['std', 'Standard'], ['pri', 'Priority']].map(([k, l]) => html`<div key=${k} className="field on-page" style=${{ width: 160 }}><label htmlFor=${'lf-' + k}>${l}</label><${Dropdown} id=${'lf-' + k} size="sm" className="on-page" value=${f[k]} onChange=${(v) => setF(Object.assign({}, f, { [k]: v }))} options=${[{ value: '', label: 'All' }].concat(uniq(k))} /></div>`)}
          ${active > 0 && html`<button className="link" onClick=${() => setF({ cat: '', std: '', pri: '' })}>Clear filters</button>`}
        </div>
        <div className="seg-tabs" role="group" aria-label="View">
          <button aria-pressed=${String(view === 'grid')} onClick=${() => { setView('grid'); setFolder(null); }}><${I} n="grid" s=${14} />Grid</button>
          <button aria-pressed=${String(view === 'folders')} onClick=${() => setView('folders')}><${I} n="folder" s=${14} />Folders</button>
        </div>
      </div>
    </div>
    <div className="scroll" style=${{ padding: '0 24px 24px' }}>
      ${showFolders ? html`<div style=${{ display: 'grid', gridTemplateColumns: 'repeat(5,minmax(0,1fr))', gap: 16 }}>${FOLDERS.map((fo) => { const inF = byStatus.filter((p) => p.folder === fo); const dr = inF.filter((p) => p.status === 'draft').length; return html`<button key=${fo} className="fcard" onClick=${() => setFolder(fo)}><${I} n="folder" s=${40} w=${1.3} c="#a6a6ae" /><span style=${{ fontWeight: 600, color: '#fff', fontSize: 15, marginTop: 6 }}>${fo}</span><span className="small muted">${inF.length} procedure${inF.length === 1 ? '' : 's'}${dr ? ' · ' + dr + ' draft' + (dr > 1 ? 's' : '') : ''}</span></button>`; })}</div>`
      : list.length ? html`<div className="grid3">${list.map((p) => html`<${ProcCard} key=${p.key} p=${p} onOpen=${onOpen} />`)}</div>`
      : html`<div className="empty"><h2 style=${{ fontSize: 16 }}>${status === 'draft' ? 'No drafts' : folder ? 'No procedures in ' + folder + ' yet' : 'No procedures match'}</h2><p className="muted">${status === 'draft' ? 'When you close the builder with Save as draft, the procedure appears here.' : 'Clear a filter or create a new procedure.'}</p><button className="btn btn-primary" onClick=${() => onCreate(folder)}>Create procedure</button></div>`}
    </div>
    ${docLib && html`<${DocLibrary} mode="library" docs=${libDocs} onImport=${onImport} onClose=${() => setDocLib(false)} onConfirm=${(docs) => { setDocLib(false); onCreateFromDocs(docs); }} />`}
  </div>`;
}
function ViewPage({ p, onBack, onEdit, flash, onDiscardPending }) {
  const flat = flatten(p.questions);
  const qs = flat.filter((f) => !f.isSection);
  const [exp, setExp] = useState(false);
  const [fmt, setFmt] = useState(null);
  const stats = [['Questions', qs.filter((f) => !f.parent).length, 'Top-level checks', 'list'], ['Required', qs.filter((f) => f.q.required).length, 'Must be answered', 'check'], ['Follow-ups', qs.filter((f) => f.parent).length, 'Shown on a matching answer', 'follow'], ['Work orders', qs.filter((f) => f.q.wo).length, 'Raised on Fail', 'warn']];
  return html`<div className="main">
    <${TopBar} crumbs=${[{ label: 'North Star Group' }, { label: 'Procedures', onClick: onBack }, { label: p.name || 'Untitled procedure' }]} />
    <div className="phead">
      <button className="ibtn xl" aria-label="Back to procedures" onClick=${onBack}><img src=${ASSET['chev-left']} width="24" height="24" alt="" /></button>
      <div className="ptitle"><span className="psub">Procedure</span><div className="row" style=${{ gap: 12 }}><h1>${p.name || 'Untitled procedure'}</h1><span className="tag pass">Published</span><span className=${'tag ' + (PRI_CLASS[p.pri] || '')}>${p.pri}</span></div></div>
      <div className="pacts"><button className="btn btn-outline" onClick=${() => setExp(true)}><${I} n="dl" />Export</button><button className="btn btn-primary" onClick=${onEdit}><${I} n="pen" />Edit</button></div>
    </div>
    <div className="scroll" style=${{ padding: 16, display: 'flex', flexDirection: 'column', gap: 12 }}>
      <div className="row" style=${{ gap: 12, alignItems: 'stretch' }}>${stats.map(([l, v, note, ic]) => html`<div key=${l} className="metric"><div className="mbody"><span className="mlabel">${l}</span><span className="mval">${v}</span><span className="mnote">${note}</span></div><span className="ichip"><${I} n=${ic} s=${20} w=${1.5} /></span></div>`)}</div>
      <div style=${{ display: 'flex', gap: 12, alignItems: 'flex-start' }}>
      <section style=${{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 8 }} aria-label="Checklist">
        ${p.pending && html`<div className="row" role="status" style=${{ padding: '12px 16px', borderRadius: 8, border: '1px solid var(--action)', background: 'var(--selected)', marginBottom: 8 }}><${I} n="pen" c="#ffc400" /><span style=${{ flex: 1 }}>You have unpublished changes saved as a draft (${p.pending.savedAt}). This page shows the published version.</span><button className="btn btn-quiet btn-sm" onClick=${onDiscardPending}>Discard draft</button><button className="btn btn-primary btn-sm" onClick=${onEdit}>Continue editing</button></div>`}
        ${p.desc &&html`<p className="muted" style=${{ marginBottom: 8, maxWidth: '65ch' }}>${p.desc}</p>`}
        ${flat.map((f) => f.isSection ? html`<div key=${f.q.id} className="section-nav" style=${{ padding: '14px 0 4px' }}>${f.q.text}</div>` : html`<div key=${f.q.id} style=${{ marginLeft: f.depth * 28, border: '1px solid var(--line)', borderRadius: 8, background: 'var(--surface)', padding: '12px 16px', display: 'flex', gap: 12, alignItems: 'flex-start' }}>
          <span className="qnum">${f.num}</span>
          <span style=${{ flex: 1, display: 'flex', flexDirection: 'column', gap: 6 }}>
            ${f.parent && html`<span className="tag sel" style=${{ alignSelf: 'flex-start' }}>If ${f.num.split('.').slice(0, -1).join('.')} is ${f.whenLabel}</span>`}
            <span style=${{ fontWeight: 500 }}>${f.q.text}${f.q.required && html`<span className="req"> *</span>`}</span>
            <span className="opts-line" style=${{ marginTop: 0 }}>${f.q.options.map((o) => html`<span key=${o.id} className="ochip"><span className="dot" style=${{ background: o.result === 'pass' ? 'var(--pass)' : o.result === 'fail' ? 'var(--fail)' : 'var(--dim)' }}></span>${o.label}</span>`)}${!isChoice(f.q.type) && html`<span className="ochip muted">${ANSWER_HINT[f.q.type]}${f.q.unit ? ' (' + f.q.unit + ')' : ''}</span>`}${f.q.wo && html`<span className="tag warn"><img src=${ASSET['bell-ring']} width="14" height="14" alt="" />Work order · ${alertName(f.q.alert) || 'No alert profile'}</span>`}</span>
          </span>
          <span className="small muted">${f.q.type}</span>
        </div>`)}
      </section>
      <aside style=${{ width: 360, flexShrink: 0, position: 'sticky', top: 0 }}>
        <section className="dcard" aria-labelledby="pd-t">
          <div className="dcard-head"><h2 id="pd-t">Procedure details</h2><button className="link" onClick=${onEdit}>Edit</button></div>
          <div className="fields">${[['Category', p.cat], ['Sub category', p.sub], ['Standard', p.std], ['Frequency', p.freq], ['Code', p.code], ['Availability', p.avail === 'org' ? 'Entire organization' : 'This property'], ['Folder', p.folder], ['Updated', p.updated]].map(([k, v]) => html`<div key=${k} className="fld"><span>${k}</span><span>${v || '—'}</span></div>`)}</div>
        </section>
      </aside>
      </div>
    </div>
    ${exp && html`<div className="scrim"><div className="dialog" role="dialog" aria-modal="true" aria-labelledby="ex-t" style=${{ width: 640 }}>
      <div className="dhead"><h2 id="ex-t" style=${{ fontSize: 20 }}>Export procedure</h2><button className="ibtn lg" style=${{ marginLeft: 'auto' }} aria-label="Close" onClick=${() => setExp(false)}><${I} n="x" s=${20} /></button></div>
      <div className="dbody" role="radiogroup" aria-label="Format" style=${{ display: 'grid', gridTemplateColumns: 'repeat(2,minmax(0,1fr))', gap: 14 }}>${[['pdf', 'PDF', 'Readable format', 'Formatted for reading or printing.', 'fail'], ['xls', 'XLS', 'Structured format', 'Structured data of the checklist.', 'pass']].map(([k, e, t, s, c]) => html`<button key=${k} role="radio" aria-checked=${String(fmt === k)} className="choice" style=${{ flexDirection: 'column', padding: 22, textAlign: 'center' }} onClick=${() => setFmt(k)}><span className=${'tag ' + c} style=${{ width: 56, height: 68, justifyContent: 'center', fontSize: 16 }}>${e}</span><span style=${{ fontWeight: 600 }}>${t}</span><span className="small muted">${s}</span></button>`)}</div>
      <div className="dfoot"><span></span><button className="btn btn-primary" disabled=${!fmt} onClick=${() => { setExp(false); flash({ msg: 'Exporting as ' + fmt.toUpperCase() }); }}>Export</button></div>
    </div></div>`}
  </div>`;
}

/* ---------------- app ---------------- */
function App() {
  const [screen, setScreen] = useState('library');
  const [railX, setRailX] = useState(() => { try { return localStorage.getItem('sclera-rail') === 'expanded'; } catch (e) { return false; } });
  const toggleRail = () => setRailX((x) => { try { localStorage.setItem('sclera-rail', x ? 'collapsed' : 'expanded'); } catch (e) {} return !x; });
  const countOf = (qs) => flatten(qs).filter((f) => !f.isSection && !f.parent).length;
  const [procs, setProcs] = useState(() => {
    const pub = PROCS.map((p) => Object.assign({}, p, { status: 'published', questions: p.key === 'fe' ? feQuestions() : (TEMPLATES.find((t) => t.key === p.key) || { specs: [] }).specs.map((s) => build(s, 'Template', p.std)), code: p.key === 'fe' ? 'FE-M-01' : '', avail: 'property' }));
    const draftQs = [build(['Is the emergency light working when mains power is cut?', 'Yes/No', { required: true, wo: true }], 'Manual', ''), build(['Does the light stay on for the full test duration?', 'Yes/No'], 'Manual', ''), mkQ('', 'Yes/No')];
    const dr = Object.assign(blankDraft(), { key: 'draft-el', status: 'draft', name: 'Emergency Lighting – Monthly', cat: 'Inspection', sub: '', folder: 'Inspection', desc: 'Monthly function test of emergency and exit lighting.', icon: 'bolt', questions: draftQs, updated: 'Sep 28, 2026' });
    return [dr].concat(pub).map((p) => Object.assign(p, { count: countOf(p.questions) }));
  });
  const [libDocs, setLibDocs] = useState(LIB_DOCS);
  const [current, setCurrent] = useState(null);
  const [draft, setDraftInit] = useState(null);
  const [isEdit, setIsEdit] = useState(false);
  const [toast, setToast] = useState(null);
  const tRef = useRef(null);
  const flash = (t) => { setToast(t); clearTimeout(tRef.current); tRef.current = setTimeout(() => setToast(null), t.undo ? 6000 : 3200); };
  const importDocs = (files) => {
    const docs = filesToDocs(files); const skipped = (files ? files.length : 0) - docs.length;
    if (docs.length) setLibDocs((l) => docs.concat(l));
    if (docs.length || skipped) flash({ msg: (docs.length ? docs.length + ' document' + (docs.length > 1 ? 's' : '') + ' imported' : 'Nothing imported') + (skipped ? ' · ' + skipped + ' skipped: only PDF and Word files are supported' : '') });
    return docs;
  };
  const create = (folder, docs) => { setDraftInit(Object.assign(blankDraft(), { key: nid('p'), folder: folder || 'Inspection', docs: docs || [] })); setIsEdit(false); setScreen('builder'); };
  const now = () => 'Sep 29, 2026';
  const open = (p) => {
    if (p.status === 'draft') { setDraftInit(Object.assign(blankDraft(), JSON.parse(JSON.stringify(p)))); setIsEdit(false); setScreen('builder'); return; }
    setCurrent(p); setScreen('view');
  };
  const saveDraft = (dd) => {
    if (isEdit) {
      setProcs((l) => l.map((x) => (x.key === dd.key ? Object.assign({}, x, { pending: Object.assign({}, dd, { savedAt: now() }) }) : x)));
      setCurrent((c) => (c && c.key === dd.key ? Object.assign({}, c, { pending: Object.assign({}, dd, { savedAt: now() }) }) : c));
      setScreen('view'); flash({ msg: 'Changes saved as a draft. The published version is still live.' });
      return;
    }
    const rec = Object.assign({}, dd, { status: 'draft', updated: now(), count: countOf(dd.questions) });
    setProcs((l) => (l.some((x) => x.key === rec.key) ? l.map((x) => (x.key === rec.key ? rec : x)) : [rec].concat(l)));
    setScreen('library'); flash({ msg: 'Saved to Drafts' });
  };
  return html`<div className="app">
    <${NavRail} expanded=${railX} onToggle=${toggleRail} />
    ${screen === 'library' && html`<${Library} procs=${procs} libDocs=${libDocs} onImport=${importDocs} flash=${flash} onCreate=${(folder) => create(folder)} onCreateFromDocs=${(docs) => create(null, docs)} onOpen=${open} />`}
    ${screen === 'view' && current && html`<${ViewPage} p=${current} onBack=${() => setScreen('library')} flash=${flash}
      onDiscardPending=${() => { const c = Object.assign({}, current); delete c.pending; setCurrent(c); setProcs((l) => l.map((x) => (x.key === c.key ? c : x))); flash({ msg: 'Draft changes discarded' }); }}
      onEdit=${() => { const src = current.pending || current; setDraftInit(Object.assign(blankDraft(), JSON.parse(JSON.stringify(src)), { key: current.key })); setIsEdit(true); setScreen('builder'); }} />`}
    ${screen === 'builder' && draft && html`<${Builder} key=${draft.key || 'new'} initial=${draft} isEdit=${isEdit} flash=${flash} libDocs=${libDocs} onImport=${importDocs} onSaveDraft=${saveDraft}
      onExit=${() => setScreen(isEdit ? 'view' : 'library')}
      onPublished=${(dd) => { const rec = Object.assign({}, dd, { status: 'published', updated: now(), count: countOf(dd.questions), icon: dd.icon || 'fe' }); delete rec.pending; delete rec.savedAt; setProcs((l) => (l.some((x) => x.key === rec.key) ? l.map((x) => (x.key === rec.key ? rec : x)) : [rec].concat(l))); setCurrent(rec); setScreen('view'); flash({ msg: isEdit ? 'Procedure updated' : 'Procedure published' }); }} />`}
    <${Toast} toast=${toast} onUndo=${() => { if (toast && toast.undo) toast.undo(); setToast(null); }} />
  </div>`;
}

class Guard extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err: err }; }
  render() {
    if (!this.state.err) return this.props.children;
    return html`<div className="empty" style=${{ margin: 48 }}><h2 style=${{ fontSize: 18 }}>Something went wrong in the prototype</h2><p className="muted">${String(this.state.err.message || this.state.err)}</p><button className="btn btn-primary" onClick=${() => location.reload()}>Reload</button></div>`;
  }
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${Guard}><${App} /><//>`);
})();
</script>
